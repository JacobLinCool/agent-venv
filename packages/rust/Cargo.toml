[package]
name = "agent-venv"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Run coding-agent CLIs in an isolated profile and workspace."
license = "MIT"
repository = "https://github.com/JacobLinCool/agent-venv"
readme = "README.md"
keywords = ["agent", "sandbox", "claude-code", "codex", "isolation"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "io-util", "time", "fs", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tempfile = "3.10"
which = "6.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "io-util", "time", "fs", "sync", "test-util"] }

[[bin]]
name = "agent-venv-conformance"
path = "bin/agent_venv_conformance.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[lib]
name = "agent_venv"
path = "src/lib.rs"
