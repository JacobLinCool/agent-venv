name: go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.25", "1.26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt check
        working-directory: packages/go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: packages/go
        run: go vet ./...
      - name: unit tests
        working-directory: packages/go
        run: go test -race ./...
      - name: integration tests
        working-directory: packages/go
        run: go test -race -tags integration ./...
