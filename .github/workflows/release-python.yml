name: release-python

on:
  push:
    tags:
      - "python-v*"

concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#python-v}"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Tag=$TAG Version=$VERSION Prerelease=$PRERELEASE"

      - uses: astral-sh/setup-uv@v8
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        working-directory: packages/python
        run: |
          MANIFEST=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$MANIFEST" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag version ${{ steps.tag.outputs.version }} != pyproject.toml version $MANIFEST"
            exit 1
          fi

      - name: Install package and conformance harness
        run: uv pip install --system -e "packages/python[dev]" -e conformance/runner

      - name: Lint
        working-directory: packages/python
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Unit tests
        working-directory: packages/python
        run: pytest tests/unit -v

      - name: Conformance (python adapter only)
        run: |
          python -m agent_venv_conformance \
            --adapter "python:python -m agent_venv.conformance" \
            --cases conformance/cases \
            --no-differential

      - name: Copy LICENSE into package
        run: cp LICENSE packages/python/LICENSE

      - name: Build wheel + sdist
        working-directory: packages/python
        run: uv build

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: agent-venv (Python) ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: |
            packages/python/dist/*
